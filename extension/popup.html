<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>PassVault Companion</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            width: 340px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            color: #f1f5f9;
            padding: 14px;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 10px;
            border-bottom: 1px solid #1e293b;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 14px;
            color: #ffffff;
        }
        .brand img { width: 22px; height: 22px; border-radius: 6px; }
        .open-btn {
            font-size: 11px;
            color: #38bdf8;
            text-decoration: none;
            font-weight: 600;
        }
        .search-box {
            margin: 12px 0;
            position: relative;
        }
        .search-box input {
            width: 100%;
            background: #1e293b;
            border: 1px solid #334155;
            padding: 8px 12px;
            border-radius: 10px;
            color: #fff;
            font-size: 12px;
            outline: none;
        }
        .search-box input:focus { border-color: #38bdf8; }
        .list {
            max-height: 220px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .item-card {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 8px 10px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .item-info {
            max-width: 180px;
            overflow: hidden;
        }
        .item-name { font-size: 12px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .item-user { font-size: 10px; color: #94a3b8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .item-actions { display: flex; gap: 4px; }
        .btn-act {
            background: #334155;
            border: none;
            color: #e2e8f0;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
        }
        .btn-act:hover { background: #475569; }
        .btn-fill { background: #2563eb; color: #fff; }
        .btn-fill:hover { background: #1d4ed8; }
        .generator-box {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid #1e293b;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .gen-pass {
            flex: 1;
            background: #1e293b;
            border: 1px solid #334155;
            padding: 6px 8px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 11px;
            color: #34d399;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .empty-hint {
            text-align: center;
            padding: 16px;
            font-size: 11px;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="brand">
            <img src="icon-128.png" alt="GembokX">
            <span>GembokX</span>
        </div>
        <a href="http://localhost/pwd/vault" target="_blank" class="open-btn">Buka Brankas ↗</a>
    </div>

    <div class="search-box">
        <input type="text" id="ext-search" placeholder="Cari akun atau URL...">
    </div>

    <div id="ext-item-list" class="list">
        <div class="empty-hint">Menghubungkan ke brankas lokal...</div>
    </div>

    <div class="generator-box">
        <div id="ext-gen-result" class="gen-pass">Membuat sandi...</div>
        <button type="button" id="ext-btn-gen" class="btn-act">Acak</button>
        <button type="button" id="ext-btn-copy-gen" class="btn-act btn-fill">Salin</button>
    </div>

    <script src="popup.js"></script>
</body>
</html>
