name: GembokX CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Code Quality & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, mbstring, openssl, gd, sodium
          coverage: none

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate PHP Syntax (Lint)
        run: |
          echo "Linting all PHP files..."
          find app public views tests -type f -name "*.php" -exec php -l {} \;

      - name: Validate JavaScript & Service Worker Syntax
        run: |
          echo "Linting JavaScript files..."
          node -c public/sw.js
          node -c public/assets/js/app.js
          node -c public/assets/js/vault.js
          node -c public/assets/js/crypto.js
          node -c public/assets/js/generator.js
          node -c public/assets/js/biometrics.js
          node -c extension/popup.js
          node -c extension/content.js

      - name: Validate JSON Manifests
        run: |
          echo "Validating JSON files..."
          node -e "JSON.parse(require('fs').readFileSync('public/manifest.json'))"
          node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json'))"

      - name: Run GembokX Automated Test Suite
        run: |
          php tests/ci_test.php

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config

      - name: Build GembokX Web Image
        run: |
          docker build -t gembokx-web:latest -f docker/Dockerfile .
