services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: gembokx_web
    restart: always
    ports:
      - "2035:80"
    volumes:
      - ./:/var/www/html
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost:2035}
      APP_KEY: ${APP_KEY:-}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-passvault_db}
      DB_USER: ${DB_USER:-passvault_user}
      DB_PASS: ${DB_PASS:-passvault_secret123}
      REDIS_ENABLED: ${REDIS_ENABLED:-true}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_PREFIX: ${REDIS_PREFIX:-gembokx:}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: mariadb:10.11
    container_name: gembokx_db
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:-root_password_change_me}
      MYSQL_DATABASE: ${DB_NAME:-passvault_db}
      MYSQL_USER: ${DB_USER:-passvault_user}
      MYSQL_PASSWORD: ${DB_PASS:-passvault_secret123}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: gembokx_redis
    restart: always
    # Port 6379 TIDAK diekspos ke host agar tidak bisa diakses dari luar container
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  mariadb_data:
    driver: local
  redis_data:
    driver: local
